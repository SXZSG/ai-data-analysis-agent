name: tests

on:
  push:
    branches: [main, feat/tool-calling-agent]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          LLM_API_KEY: ""
          PYTHONPATH: .
        run: pytest -q
      - name: Compile Python modules
        run: python -m compileall -q app.py src tools tests
